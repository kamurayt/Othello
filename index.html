<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オセロ</title>

<style>
body{
    margin:0;
    background:#222;
    color:white;
    font-family:sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
}

h1{
    margin-bottom:10px;
}

#turn{
    margin-bottom:15px;
    font-size:24px;
}

#board{
    display:grid;
    grid-template-columns:repeat(8,70px);
    grid-template-rows:repeat(8,70px);
    border:4px solid white;
}

.cell{
    width:70px;
    height:70px;
    background:green;
    border:1px solid black;
    display:flex;
    align-items:center;
    justify-content:center;
}

.stone{
    width:55px;
    height:55px;
    border-radius:50%;
}

.black{
    background:black;
}

.white{
    background:white;
}
</style>
</head>

<body>

<h1>オセロ</h1>
<div id="turn">黒のターン</div>

<div id="board"></div>

<script>
const board = document.getElementById("board");
const turnText = document.getElementById("turn");

let currentPlayer = "black";

let cells = [];

for(let y=0;y<8;y++){
    cells[y]=[];

    for(let x=0;x<8;x++){

        const cell=document.createElement("div");
        cell.className="cell";

        cell.dataset.x=x;
        cell.dataset.y=y;

        board.appendChild(cell);

        cells[y][x]=null;

        cell.addEventListener("click",()=>{

            if(cells[y][x]!==null)return;

            placeStone(cell,x,y,currentPlayer);

            currentPlayer =
                currentPlayer==="black"
                ? "white"
                : "black";

            turnText.textContent =
                currentPlayer==="black"
                ? "黒のターン"
                : "白のターン";
        });
    }
}

function placeStone(cell,x,y,color){

    const stone=document.createElement("div");
    stone.className=`stone ${color}`;

    cell.appendChild(stone);

    cells[y][x]=color;
}

placeStone(board.children[27],3,3,"white");
placeStone(board.children[28],4,3,"black");
placeStone(board.children[35],3,4,"black");
placeStone(board.children[36],4,4,"white");

</script>

</body>
</html>
