<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>オンラインオセロ</title>

<style>
body{
    margin:0;
    background:#1e1e22;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

h1{
    font-size:60px;
    margin:20px 0 10px;
}

#turn{
    font-size:28px;
    margin-bottom:10px;
}

#score{
    font-size:24px;
    margin-bottom:15px;
}

#board{
    width:min(92vw,92vh);
    height:min(92vw,92vh);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    background:#008000;
    border:4px solid white;
}

.cell{
    border:1px solid black;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.disk{
    width:80%;
    height:80%;
    border-radius:50%;
}

.black{
    background:black;
}

.white{
    background:white;
}

.hint{
    width:18%;
    height:18%;
    border-radius:50%;
    background:rgba(255,255,255,0.5);
}

button{
    margin-top:20px;
    padding:12px 30px;
    font-size:22px;
    border:none;
    border-radius:10px;
}

#message{
    font-size:28px;
    margin-top:15px;
    color:#ffcc00;
}
</style>
</head>

<body>

<h1>オセロ</h1>

<div id="turn"></div>
<div id="score"></div>

<div id="board"></div>

<div id="message"></div>

<button onclick="requestReset()">リセット申請</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
getDatabase,
ref,
set,
onValue,
update
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDhx5_Rh-fqZxjuQla78vuooc6l0QEYGYc",
authDomain: "othello-7216e.firebaseapp.com",
projectId: "othello-7216e",
storageBucket: "othello-7216e.firebasestorage.app",
messagingSenderId: "243717958092",
appId: "1:243717958092:web:18fda7822ef8922e781569",
measurementId: "G-X096PWC9TE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const gameRef = ref(db,"game");

let board=[];
let currentPlayer="black";
let resetRequest=false;

function createBoard(){

board=[];

for(let y=0;y<8;y++){
    board[y]=[];
    for(let x=0;x<8;x++){
        board[y][x]="";
    }
}

board[3][3]="white";
board[3][4]="black";
board[4][3]="black";
board[4][4]="white";

saveGame();
}

function saveGame(){

set(gameRef,{
    board,
    currentPlayer,
    resetRequest
});
}

function isInside(x,y){
return x>=0 && x<8 && y>=0 && y<8;
}

function getValidMoves(player){

const enemy=player==="black"?"white":"black";

let moves=[];

for(let y=0;y<8;y++){
for(let x=0;x<8;x++){

if(board[y][x]!="") continue;

let valid=false;

for(let dx=-1;dx<=1;dx++){
for(let dy=-1;dy<=1;dy++){

if(dx===0 && dy===0) continue;

let nx=x+dx;
let ny=y+dy;

let foundEnemy=false;

while(isInside(nx,ny)&&board[ny][nx]===enemy){
    nx+=dx;
    ny+=dy;
    foundEnemy=true;
}

if(foundEnemy&&isInside(nx,ny)&&board[ny][nx]===player){
    valid=true;
}
}
}

if(valid){
moves.push({x,y});
}
}
}

return moves;
}

function placeDisk(x,y){

const moves=getValidMoves(currentPlayer);

let ok=moves.find(m=>m.x===x&&m.y===y);

if(!ok){
document.getElementById("message").innerText="そこには置けません";
setTimeout(()=>{
document.getElementById("message").innerText="";
},1200);
return;
}

board[y][x]=currentPlayer;

const enemy=currentPlayer==="black"?"white":"black";

for(let dx=-1;dx<=1;dx++){
for(let dy=-1;dy<=1;dy++){

if(dx===0&&dy===0) continue;

let nx=x+dx;
let ny=y+dy;

let flip=[];

while(isInside(nx,ny)&&board[ny][nx]===enemy){
flip.push([nx,ny]);
nx+=dx;
ny+=dy;
}

if(isInside(nx,ny)&&board[ny][nx]===currentPlayer){

flip.forEach(p=>{
board[p[1]][p[0]]=currentPlayer;
});
}
}
}

currentPlayer=currentPlayer==="black"?"white":"black";

checkGameEnd();

saveGame();
}

function checkGameEnd(){

const blackMoves=getValidMoves("black");
const whiteMoves=getValidMoves("white");

if(blackMoves.length===0&&whiteMoves.length===0){

let black=0;
let white=0;

for(let row of board){
for(let cell of row){

if(cell==="black") black++;
if(cell==="white") white++;
}
}

if(black>white){
alert("黒の勝ち！");
}else if(white>black){
alert("白の勝ち！");
}else{
alert("引き分け！");
}
}
}

function render(){

const boardDiv=document.getElementById("board");
boardDiv.innerHTML="";

const moves=getValidMoves(currentPlayer);

let black=0;
let white=0;

for(let y=0;y<8;y++){
for(let x=0;x<8;x++){

const cell=document.createElement("div");
cell.className="cell";

cell.onclick=()=>placeDisk(x,y);

if(board[y][x]){

const disk=document.createElement("div");
disk.className=`disk ${board[y][x]}`;

cell.appendChild(disk);

if(board[y][x]==="black") black++;
if(board[y][x]==="white") white++;

}else{

const canPut=moves.find(m=>m.x===x&&m.y===y);

if(canPut){

const hint=document.createElement("div");
hint.className="hint";
cell.appendChild(hint);
}
}

boardDiv.appendChild(cell);
}
}

document.getElementById("turn").innerText=
currentPlayer==="black"?"黒のターン":"白のターン";

document.getElementById("score").innerText=
`黒 ${black} - ${white} 白`;

if(resetRequest){
showResetConfirm();
}
}

function requestReset(){

update(gameRef,{
resetRequest:true
});
}

function showResetConfirm(){

const ok=confirm("相手がリセットを申請しました。OKでリセットします");

if(ok){
resetRequest=false;
createBoard();
}else{
update(gameRef,{
resetRequest:false
});
}
}

onValue(gameRef,(snapshot)=>{

const data=snapshot.val();

if(!data){
createBoard();
return;
}

board=data.board;
currentPlayer=data.currentPlayer;
resetRequest=data.resetRequest||false;

render();
});

</script>

</body>
</html>
